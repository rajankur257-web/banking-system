
{% extends "base.html" %}
{% block content %}
  <h2>Sign In</h2>
  <form method="POST" class="card">
    <label>Username
      <input type="text" name="username" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn">Login</button>
  </form>
{% endblock %}
